name: NutriGuard Clinical Safety Evals (30 Golden Cases)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  clinical-safety-evals:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: nutriguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:ci_password@localhost:5432/nutriguard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed database schema & clinical catalog
        run: |
          PGPASSWORD=ci_password psql -h localhost -U postgres -d nutriguard -f Database/00_all_in_one.sql

      - name: Run 30 Golden Cases Safety Evaluation (Gate: Pass >= 90%, FP <= 5%)
        run: |
          python evals/test_safety.py --fast --min-pass-rate 0.90 --max-fp-rate 0.05

      - name: Upload Evaluation Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nutriguard-eval-report
          path: |
            evals/latest_report.json
            evals/latest_report.md
